name: Regenerate Post

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID to regenerate"
        required: true
        type: number
      mode:
        description: "What to regenerate"
        required: true
        type: choice
        options: [image, text, both]
        default: image
      notes:
        description: "Notes on what to improve (e.g. 'more energetic tone' or 'stadium aerial view, no abstract shapes')"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: repo-state-mutations
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }
      - run: npm ci

      - name: Regenerate post
        run: |
          node src/generate.js \
            --post-id ${{ inputs.post_id }} \
            --mode ${{ inputs.mode }} \
            ${{ inputs.notes && format('--notes "{0}"', inputs.notes) || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_ENV: production

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/videos
          git add data/posts.db data/images/ data/videos/ data/sport-rotation.json
          git diff --staged --quiet || git commit -m "chore: regenerate post ${{ inputs.post_id }} (${{ inputs.mode }})"
          git push
